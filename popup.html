<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="anim.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="ytg-stage" id="bg"></div>
  <header>
    <div class="logo" id="logo">&#10022;</div>
    <h1>Gold <span>Glass</span></h1>
    <span class="toast" id="toast"></span>
    <span class="grow"></span>
    <label class="sw" title="Turn the theme on / off"><input type="checkbox" data-k="enabled"><i></i></label>
  </header>

  <main>
    <section id="viewGallery" class="gallery-layout">
      <!-- TOP: Live 16:9 Preview Frame with Live Ambient Animation & Pop-in Center Badge -->
      <div class="preview-center-wrap">
        <div class="pv" id="pv">
          <div class="ytg-stage" id="stage"></div>
          <div class="mock">
            <div class="mtop"><i class="mmenu"></i><b class="mlogo"></b><i class="msearch"></i><i class="mbtn"></i><i class="mav"></i></div>
            <div class="mchips"><i class="on"></i><i></i><i></i><i></i></div>
            <div class="mside"><i></i><i></i><i></i><i></i></div>
            <div class="mgrid">
              <div class="mc"><span class="vid"><u></u></span><em></em><s></s></div>
              <div class="mc"><span class="vid"><u></u></span><em></em><s></s></div>
              <div class="mc"><span class="vid"><u></u></span><em></em><s></s></div>
              <div class="mc"><span class="vid"><u></u></span><em></em><s></s></div>
              <div class="mc"><span class="vid"><u></u></span><em></em><s></s></div>
              <div class="mc"><span class="vid"><u></u></span><em></em><s></s></div>
            </div>
            <!-- Pop-in / Pop-out Animated Center Badge -->
            <div class="flash pop-badge" id="flash"></div>
            <div class="mpop"><b></b><i></i><i></i><i class="s"></i></div>
          </div>
        </div>
        <div class="cur" id="curBadge"><b id="curName"></b><span id="curAnim"></span></div>
        <!-- Transparency Mode Buttons: Normal, Ultra, Max -->
        <div class="trans-mode-bar" id="transModes">
          <span class="tmb-title">Transparency:</span>
          <button class="trans-btn on" data-mode="normal" title="Normal: Dark and thin glass">Normal</button>
          <button class="trans-btn" data-mode="ultra" title="Ultra: Enhanced crystal glass & brighter glow">Ultra</button>
          <button class="trans-btn" data-mode="max" title="Max: Maximum liquid see-through clarity">Max</button>
        </div>
      </div>

      <!-- MIDDLE: Themes Carousel (Previous, Current centered with gold glow, Next) -->
      <div class="themes-section-wide">
        <div class="themes-header">
          <h2>Themes</h2>
          <span class="hint">Click or scroll to switch</span>
        </div>
        <div class="themes-carousel-container">
          <button class="carousel-nav-btn prev" id="themePrev" title="Previous theme" aria-label="Previous theme">&#10094;</button>
          <div class="themes-track-wrap">
            <div class="themes-track" id="grid"></div>
          </div>
          <button class="carousel-nav-btn next" id="themeNext" title="Next theme" aria-label="Next theme">&#10095;</button>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
        <div id="msg"></div>
      </div>

      <!-- BOTTOM: Live Animations Bar & Vertical Speed Wheel -->
      <div class="bottom-controls-bar">
        <div class="anim-col-wide">
          <div class="head"><h2>Animation</h2></div>
          <div class="anim-cards-row" id="pills"></div>
        </div>
        <div class="speed-col-vertical">
          <div class="head"><h2>Speed</h2></div>
          <div class="speed-wheel-container">
            <button class="speed-nav-btn up" id="speedUp" title="Increase speed" aria-label="Increase speed">&#9650;</button>
            <div class="speed-wheel-track" id="speedList"></div>
            <button class="speed-nav-btn down" id="speedDown" title="Decrease speed" aria-label="Decrease speed">&#9660;</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
